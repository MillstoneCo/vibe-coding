<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator</title>
<style>
  :root {
    --bg: #fff4f8;
    --surface: #ffffff;
    --ink: #5c2840;
    --muted: #a97b91;
    --line: #f8dce8;
    --well: #fff7fa;
    --accent: #f8b9d0;
    --accent-ink: #6b1f45;
    --accent-soft: #fdeaf2;
    --mid: #e580a8;
    --digit: #d0558a;
    --symbol: #a63a72;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(229, 128, 168, 0.16);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .output {
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px;
    min-height: 104px;
    display: flex;
    align-items: center;
  }

  #password {
    margin: 0;
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: clamp(1.4rem, 5.4vw, 2rem);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.02em;
    word-break: break-all;
    user-select: all;
    -webkit-user-select: all;
  }
  #password .d { color: var(--digit); }
  #password .s { color: var(--symbol); }

  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 2px 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .copy {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    min-width: 150px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .copy:hover { border-color: var(--mid); }
  .copy.done {
    background: var(--accent-soft);
    border-color: var(--mid);
    color: var(--accent-ink);
  }

  .control { margin-top: 24px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  label.title, .legend {
    font-weight: 600;
    font-size: 0.95rem;
  }

  input[type="number"] {
    width: 78px;
    font: inherit;
    font-weight: 600;
    text-align: center;
    color: var(--ink);
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 6px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--mid);
    height: 28px;
    margin: 0;
  }

  fieldset {
    border: 0;
    margin: 24px 0 0;
    padding: 0;
  }
  .legend { padding: 0; margin-bottom: 10px; display: block; }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .opt:has(input:checked) {
    background: var(--accent-soft);
    border-color: var(--mid);
  }
  .opt input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--mid);
    flex: none;
  }
  .opt small {
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin-left: auto;
  }

  .generate {
    appearance: none;
    display: block;
    width: 100%;
    margin-top: 26px;
    padding: 18px 20px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s;
  }
  .generate:hover { filter: brightness(0.97); }
  .generate:active { transform: scale(0.985); }

  .note {
    min-height: 1.3em;
    margin: 12px 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }

  button:focus-visible,
  input:focus-visible,
  .opt:focus-within {
    outline: 3px solid var(--mid);
    outline-offset: 2px;
  }

  @media (max-width: 420px) {
    .card { padding: 20px 16px; border-radius: 16px; }
    .options { grid-template-columns: 1fr; }
    .meta { flex-direction: column-reverse; align-items: stretch; text-align: center; }
    .copy { width: 100%; padding: 12px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Password generator</h1>
    <p class="sub">Created in your browser. Nothing is sent or stored.</p>

    <div class="output">
      <p id="password" aria-live="polite" aria-label="Generated password"></p>
    </div>
    <div class="meta">
      <span id="strength"></span>
      <button type="button" id="copy" class="copy">Copy to clipboard</button>
    </div>

    <div class="control">
      <div class="row">
        <label class="title" for="lengthNum">Length</label>
        <input type="number" id="lengthNum" min="8" max="64" value="16" inputmode="numeric">
      </div>
      <input type="range" id="lengthRange" min="8" max="64" value="16" aria-label="Password length slider">
    </div>

    <fieldset>
      <legend class="legend">Characters</legend>
      <div class="options">
        <label class="opt"><input type="checkbox" id="upper" checked> Uppercase <small>A–Z</small></label>
        <label class="opt"><input type="checkbox" id="lower" checked> Lowercase <small>a–z</small></label>
        <label class="opt"><input type="checkbox" id="numbers" checked> Numbers <small>0–9</small></label>
        <label class="opt"><input type="checkbox" id="symbols" checked> Symbols <small>!@#</small></label>
      </div>
    </fieldset>

    <button type="button" id="generate" class="generate">Generate</button>
    <p class="note" id="note" role="status"></p>
  </main>

<script>
(function () {
  "use strict";

  var SETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{}:;,.?"
  };

  var els = {
    pw: document.getElementById("password"),
    strength: document.getElementById("strength"),
    copy: document.getElementById("copy"),
    gen: document.getElementById("generate"),
    num: document.getElementById("lengthNum"),
    range: document.getElementById("lengthRange"),
    note: document.getElementById("note"),
    boxes: {
      upper: document.getElementById("upper"),
      lower: document.getElementById("lower"),
      numbers: document.getElementById("numbers"),
      symbols: document.getElementById("symbols")
    }
  };

  var current = "";
  var copyTimer = null;

  // Unbiased secure random integer in [0, max)
  function randInt(max) {
    var buf = new Uint32Array(1);
    var limit = Math.floor(4294967296 / max) * max;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  function clampLength(v) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = 16;
    return Math.min(64, Math.max(8, v));
  }

  function activeSets() {
    return Object.keys(SETS).filter(function (k) { return els.boxes[k].checked; });
  }

  function buildPassword(length, keys) {
    var pool = keys.map(function (k) { return SETS[k]; }).join("");
    var chars = [];
    // Guarantee at least one character from each selected set
    keys.forEach(function (k) {
      chars.push(SETS[k][randInt(SETS[k].length)]);
    });
    while (chars.length < length) {
      chars.push(pool[randInt(pool.length)]);
    }
    // Fisher-Yates shuffle with secure randomness
    for (var i = chars.length - 1; i > 0; i--) {
      var j = randInt(i + 1);
      var t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }
    return chars.join("");
  }

  function render(pw) {
    els.pw.textContent = "";
    for (var i = 0; i < pw.length; i++) {
      var c = pw[i];
      var span = document.createElement("span");
      if (SETS.numbers.indexOf(c) !== -1) span.className = "d";
      else if (SETS.symbols.indexOf(c) !== -1) span.className = "s";
      span.textContent = c;
      els.pw.appendChild(span);
    }
  }

  function describe(length, keys) {
    var size = keys.reduce(function (n, k) { return n + SETS[k].length; }, 0);
    var bits = Math.round(length * Math.log2(size));
    var label = bits < 60 ? "Fair" : bits < 90 ? "Strong" : "Very strong";
    return label + " · about " + bits + " bits";
  }

  function generate() {
    var keys = activeSets();
    if (!keys.length) return;
    var length = clampLength(els.num.value);
    els.num.value = length;
    els.range.value = length;
    current = buildPassword(length, keys);
    render(current);
    els.strength.textContent = describe(length, keys);
    resetCopy();
  }

  function resetCopy() {
    clearTimeout(copyTimer);
    els.copy.textContent = "Copy to clipboard";
    els.copy.classList.remove("done");
  }

  function showCopied() {
    els.copy.textContent = "Copied!";
    els.copy.classList.add("done");
    clearTimeout(copyTimer);
    copyTimer = setTimeout(resetCopy, 1500);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copy() {
    if (!current) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(current).then(showCopied, function () {
        if (fallbackCopy(current)) showCopied();
      });
    } else if (fallbackCopy(current)) {
      showCopied();
    }
  }

  // Keep slider and number input in sync
  els.range.addEventListener("input", function () {
    els.num.value = els.range.value;
    generate();
  });
  els.num.addEventListener("input", function () {
    var v = parseInt(els.num.value, 10);
    if (!isNaN(v) && v >= 8 && v <= 64) {
      els.range.value = v;
      generate();
    }
  });
  els.num.addEventListener("change", function () {
    els.num.value = clampLength(els.num.value);
    els.range.value = els.num.value;
    generate();
  });

  // At least one character type must stay selected
  Object.keys(els.boxes).forEach(function (k) {
    els.boxes[k].addEventListener("change", function () {
      if (!activeSets().length) {
        els.boxes[k].checked = true;
        els.note.textContent = "Keep at least one character type selected.";
        return;
      }
      els.note.textContent = "";
      generate();
    });
  });

  els.gen.addEventListener("click", generate);
  els.copy.addEventListener("click", copy);

  generate();
})();
</script>
</body>
</html>
